<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Decorative grid pattern -->
  <g opacity="0.05">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>
  
  <!-- Glowing orb in background -->
  <circle cx="900" cy="315" r="250" fill="url(#glow-gradient)"/>
  <circle cx="300" cy="500" r="150" fill="url(#glow-gradient)" opacity="0.5"/>
  
  <!-- Main content container -->
  <g transform="translate(80, 120)">
    <!-- Logo/Icon -->
    <g transform="translate(0, 20)">
      <!-- Mail envelope shape -->
      <rect x="0" y="0" width="120" height="90" rx="8" fill="url(#accent-gradient)" filter="url(#glow)"/>
      <path d="M0 0 L60 50 L120 0" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0 90 L60 50 L120 90" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
      
      <!-- AI sparkles -->
      <circle cx="95" cy="15" r="4" fill="#fbbf24" filter="url(#glow)"/>
      <circle cx="105" cy="25" r="3" fill="#fbbf24" filter="url(#glow)"/>
      <circle cx="90" cy="30" r="2" fill="#fbbf24" filter="url(#glow)"/>
    </g>
    
    <!-- Title -->
    <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white">
      MailPilot
    </text>
    
    <!-- Tagline -->
    <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">
      AI-Powered Mail
    </text>
    
    <!-- Feature badges -->
    <g transform="translate(0, 260)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="180" height="40" rx="20" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
      <text x="90" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="white" text-anchor="middle">
        Natural Language
      </text>
      
      <!-- Badge 2 -->
      <rect x="200" y="0" width="140" height="40" rx="20" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
      <text x="270" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="white" text-anchor="middle">
        Smart Actions
      </text>
      
      <!-- Badge 3 -->
      <rect x="360" y="0" width="120" height="40" rx="20" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
      <text x="420" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="white" text-anchor="middle">
        Real-time
      </text>
    </g>
    
    <!-- Email preview mockup -->
    <g transform="translate(0, 330)">
      <!-- Email card -->
      <rect x="0" y="0" width="500" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      
      <!-- Email header -->
      <circle cx="25" cy="25" r="12" fill="#3b82f6"/>
      <rect x="45" y="15" width="120" height="20" rx="4" fill="#475569"/>
      <rect x="400" y="15" width="80" height="20" rx="4" fill="#334155"/>
      
      <!-- Email subject -->
      <rect x="25" y="50" width="300" height="16" rx="4" fill="#64748b"/>
      
      <!-- Email body lines -->
      <rect x="25" y="80" width="450" height="12" rx="4" fill="#334155"/>
      <rect x="25" y="100" width="380" height="12" rx="4" fill="#334155"/>
      <rect x="25" y="120" width="250" height="12" rx="4" fill="#334155"/>
    </g>
  </g>
  
  <!-- Right side AI illustration -->
  <g transform="translate(700, 150)">
    <!-- Chat bubble -->
    <rect x="0" y="0" width="380" height="120" rx="16" fill="#1e293b" stroke="url(#accent-gradient)" stroke-width="2"/>
    
    <!-- AI command text -->
    <text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#3b82f6">
      "Show me emails from last week"
    </text>
    <text x="20" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#3b82f6">
      "Reply to the latest message"
    </text>
    <text x="20" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#3b82f6">
      "Compose email to team..."
    </text>
    
    <!-- Typing indicator -->
    <circle cx="340" cy="95" r="4" fill="#8b5cf6">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="355" cy="95" r="4" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="370" cy="95" r="4" fill="#8b5cf6">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Bottom URL -->
  <text x="600" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#64748b" text-anchor="middle">
    mailpilot.app
  </text>
</svg>
