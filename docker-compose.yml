services:
  postgres:
    image: postgres:17-alpine
    container_name: mailpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailpilot}
      POSTGRES_DB: ${POSTGRES_DB:-mailpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
